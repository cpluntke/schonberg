<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"IBM Plex Mono";src:url(fonts/PlexMono.ttf);font-weight:500}
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/Bricolage.ttf);font-weight:100 900}
@font-face{font-family:"Source Serif 4";src:url(fonts/SourceSerif.ttf);font-weight:200 900}
html,body{margin:0;background:#0B0D1A}canvas{display:block}
</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
const TL=__TIMELINE__;
const C={paper:'#0B0D1A',panel:'#151933',ink:'#EEF0FF',muted:'#A8B0D6',faint:'#6B739C',rule:'#262B4D',
  orange:'#FF7A45',cyan:'#4CC9F0',purple:'#B3A6FF',nora:'#FF7A45',ben:'#4CC9F0',deep:'#1D4F63'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1280,H=720;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x)},lerp=(a,b,u)=>a+(b-a)*u;
const MONO=s=>`500 ${s}px "IBM Plex Mono"`,DISP=s=>`800 ${s}px "Bricolage Grotesque"`,DISP6=s=>`600 ${s}px "Bricolage Grotesque"`,SERIF=s=>`400 ${s}px "Source Serif 4"`;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,font,color,align){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.fillText(s,x,y);ctx.textAlign='left'}
function lineIdx(t){let i=0;TL.lines.forEach((l,j)=>{if(t>=l.start-0.25)i=j});return i}
const L=i=>TL.lines[i], lp=(i,t)=>(t-L(i).start)/L(i).dur, since=(i,t)=>t-L(i).start;
const sceneOf=i=>L(i).scene, firstOf=sc=>TL.lines.findIndex(l=>l.scene===sc);
const at=(i,f,t)=>ease((lp(i,t)-f)/0.12); // reveal at fraction f of line i
function wrapText(s,maxW){const out=[];let cur='';for(const w of s.split(' ')){const tt=cur?cur+' '+w:w;if(ctx.measureText(tt).width>maxW&&cur){out.push(cur);cur=w}else cur=tt}if(cur)out.push(cur);return out}

/* images */
const IMG={};['practice-score','practice-toggle','practice-highway','setup-choir','setup-range','setup-delay','piece','piece-tofix','fullscore-laptop','results-coach','home'].forEach(n=>{const im=new Image();im.src='img/'+n+'.png';IMG[n]=im});
const logo=new Image();logo.src='img/icon.svg';
const imgReady=Promise.all([...Object.values(IMG),logo].map(im=>new Promise(r=>{if(im.complete)r();else{im.onload=r;im.onerror=r}})));
// visible from line a until line b ends (next line starts), with short fades
const win=(t,a,b)=>{const t0=L(a).start-0.35,t1=b+1<TL.lines.length?L(b+1).start-0.45:1e9;return ease((t-t0)/0.4)*(1-ease((t-t1)/0.4))};

/* phone mockup: css-px coordinates of the 390×844 screenshot map into the frame */
const PH={h:480};PH.s=PH.h/844;PH.w=390*PH.s;
function phone(name,x,y,A,opts={}){
  const s=PH.s,w=PH.w,h=PH.h,src=IMG[name];if(!src)return;
  ctx.globalAlpha=A;ctx.fillStyle='#000';rr(x-9,y-9,w+18,h+18,30);ctx.fill();
  ctx.strokeStyle='#30365C';ctx.lineWidth=2;rr(x-9,y-9,w+18,h+18,30);ctx.stroke();
  ctx.save();rr(x,y,w,h,22);ctx.clip();
  const sy=(opts.scrollCss||0)*2; // screenshots are @2x
  ctx.drawImage(src,0,sy,780,1688,x,y,w,h);ctx.restore();ctx.globalAlpha=1;}
const P=(px,py,ox,oy)=>[ox+px*PH.s,oy+py*PH.s];

function callout(px,py,lx,ly,label,sub,color,A){ // dot on phone + line + label
  if(A<=0.01)return;ctx.globalAlpha=A;ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(lx-14,ly-8);ctx.stroke();
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,7,0,7);ctx.fill();
  ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,13+4*Math.sin(A*6),0,7);ctx.globalAlpha=A*0.4;ctx.stroke();ctx.globalAlpha=A;
  text(label,lx,ly,DISP6(28),color);if(sub)text(sub,lx,ly+30,SERIF(21),C.muted);ctx.globalAlpha=1}

/* --- scenes ---
   Line indices (script.json): 0 A title · 1–5 B voice setup (1 choir code, 3 range, 4–5 delay) ·
   6–8 C practice screen · 9–14 D level ladder + sing it all · 15–16 E coach notes · 17 F home · 18–21 G try it now */
const C2={green:'#6EE7A8'};
function sceneA(t,A){const a=A*ease(since(0,t)/0.8);ctx.globalAlpha=a;
  // little highway motif
  const y0=410;ctx.lineWidth=5;ctx.lineCap='round';
  for(let k=0;k<5;k++){const x=330+k*130+ (-(t*60)%130);ctx.fillStyle=C.orange;rr(x,y0-((k*37)%60),100,26,13);ctx.fill();}
  ctx.strokeStyle=C.cyan;ctx.beginPath();for(let x=200;x<=640;x+=6){const yy=y0+13-40*Math.sin(x/90+t*1.2)*0.5-((x-200)/440)*20;x===200?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke();
  ctx.fillStyle=C.ink;ctx.fillRect(640,330,3,150);
  ctx.globalAlpha=a;if(logo.complete)ctx.drawImage(logo,W/2-48,120,96,96);
  text('Schönberg Hero',W/2,290,DISP(84),C.ink,'center');
  text('Learn your choir part, one phrase at a time',W/2,530,SERIF(28),C.muted,'center');ctx.globalAlpha=1}

function chip(x,y,label,color,A,fill){ctx.globalAlpha=A;ctx.font=DISP6(24);const w=ctx.measureText(label).width+36;
  ctx.fillStyle=fill?color:C.panel;rr(x,y,w,48,24);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;rr(x,y,w,48,24);ctx.stroke();
  text(label,x+18,y+32,DISP6(24),fill?C.paper:C.ink);ctx.globalAlpha=1;return w}

/* B: voice setup. One phone slot that changes picture: choir code → range check → delay. */
function sceneB(t,A){const x=150,y=110;
  const w1=win(t,1,2),w2=win(t,3,3),w3=win(t,4,5);
  // first phone shows without fade-in at the scene start (the scene fade covers it)
  phone('setup-choir',x,y,A*(t<L(1).start?1:w1));phone('setup-range',x,y,A*w2);phone('setup-delay',x,y,A*w3);
  // 1: choir code
  if(w1>0.01){const a=A*w1;
    callout(...P(90,331,x,y),560,180,'Your choir code',null,C.orange,a*at(1,0.16,t));
    const f=a*at(1,0.42,t);if(f>0.01){ctx.globalAlpha=f;text('brings in',560,262,SERIF(23),C.muted);ctx.globalAlpha=1;
      let cx=672;cx+=chip(cx,232,'Programme',C.cyan,f)+14;chip(cx,232,'Scores',C.cyan,f);}
    callout(...P(195,765,x,y),560,440,'No code?','practise on your own',C.purple,a*at(1,0.78,t));}
  // 3: range check, a do-re-mi pattern one step higher each round
  if(w2>0.01){const a=A*w2,bx=540,by=150,bw=640,bh=340;ctx.globalAlpha=a;
    ctx.fillStyle=C.panel;rr(bx,by,bw,bh,18);ctx.fill();
    const steps=['Comfortable','Middle','Up','Down'],sp=lp(3,t),cur=sp<0.08?0:sp<0.2?1:sp<0.62?2:3;let sx=bx+24;
    steps.forEach((n,k)=>{const col=k===cur?C.orange:k<cur?C.cyan:C.faint;const lab=(k<cur?'✓ ':'')+n+(k<3?' ·':'');text(lab,sx,by+40,MONO(17),col);ctx.font=MONO(17);sx+=ctx.measureText(lab).width+10});
    for(let y2=by+70;y2<=by+bh-30;y2+=24){ctx.fillStyle=C.rule;ctx.fillRect(bx+20,y2,bw-40,1)}
    const PAT=[0,2,4,2,0],nw=21,rw=5*nw+12,yOf=st=>by+bh-58-st*14;
    const rounds=[0,2,4,6,8],t0=L(3).start+0.6,per=0.95;
    rounds.forEach((r,k)=>{const rs=t0+k*per;if(t<rs)return;const top=k===4;
      PAT.forEach((d,j)=>{const nt=rs+j*0.12;if(t<nt)return;const nx=bx+30+k*rw+j*nw,ny=yOf(r+d);
        ctx.globalAlpha=a*ease((t-nt)/0.15)*(top?0.45:1);ctx.fillStyle=top?C.faint:C.orange;rr(nx,ny-6,nw-3,12,5);ctx.fill();
        if(k===0){ctx.globalAlpha=a*ease((t-nt)/0.15);text(['do','re','mi','re','do'][j],nx+nw/2-1,yOf(4)-18,MONO(14),C.ink,'center')}});
      ctx.globalAlpha=a*ease((t-rs-0.6)/0.3);text(top?'✗':'✓',bx+30+k*rw+2*nw+9,yOf(r)+32,DISP6(22),top?C.faint:C.cyan,'center')});
    ctx.globalAlpha=1;
    const h=a*at(3,0.32,t);if(h>0.01){ctx.globalAlpha=h;text('one step higher each round ↗',bx+24,by+bh+44,DISP6(26),C.ink);ctx.globalAlpha=1}
    const p=a*at(3,0.78,t);if(p>0.01){ctx.globalAlpha=p;const px=bx+30+4*rw+2*nw+9;ctx.strokeStyle=C.orange;ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,yOf(12)-34,22,0,7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(px-15,yOf(12)-19);ctx.lineTo(px+15,yOf(12)-49);ctx.stroke();
      text("Don't push the top notes",bx+24,by+bh+84,DISP6(26),C.orange);ctx.globalAlpha=1}}
  // 4–5: headphones, then clicks + "ta"
  if(w3>0.01){const a1=A*w3*at(4,0.2,t);ctx.globalAlpha=a1;
    const hx=880,hy=220;ctx.strokeStyle=C.cyan;ctx.lineWidth=10;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(hx,hy,70,Math.PI,0);ctx.stroke();ctx.fillStyle=C.cyan;rr(hx-90,hy-10,36,70,12);ctx.fill();rr(hx+54,hy-10,36,70,12);ctx.fill();
    text('Wired headphones',hx,hy+110,DISP6(30),C.ink,'center');text('so the mic only hears you',hx,hy+142,SERIF(22),C.muted,'center');
    ctx.globalAlpha=1;
    const a2=A*w3*at(5,0.42,t);if(a2>0.01){ctx.globalAlpha=a2;
      for(let k=0;k<6;k++){const cx=735+k*58,cy=450;const ph=((t-L(5).start-0.42*L(5).dur)*1.6-k*0.3);const on=ph>0&&ph%1.8<0.35;
        ctx.fillStyle=on?C.orange:C.rule;ctx.beginPath();ctx.arc(cx,cy,on?16:12,0,7);ctx.fill();
        if(on)text('ta',cx,cy-28,DISP6(22),C.orange,'center')}
      text('6 clicks → delay measured',880,512,MONO(20),C.muted,'center');ctx.globalAlpha=1}}}

/* C: the practice screen. Line 6: score view (sheet music, blue ink, zoom on a flat note) ·
   7: the pre-start screen with the Score/Highway toggle · 8: tap Highway → highway phone, then both
   phones side by side for the ± cents bubble. Coordinates are css px of the 390×844 screenshots. */
const ramp=(i,f,t,d)=>ease((t-L(i).start-f*L(i).dur)/(d||0.45));
function ring(cx,cy,r,color,A){if(A<=0.01)return;ctx.globalAlpha=A;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();ctx.globalAlpha=1}
function pill(x,y,sel,A){if(A<=0.01)return;const w=300,h=52,hw=w/2;ctx.globalAlpha=A;
  ctx.fillStyle=C.panel;rr(x,y,w,h,26);ctx.fill();ctx.strokeStyle=C.rule;ctx.lineWidth=2;rr(x,y,w,h,26);ctx.stroke();
  ctx.fillStyle=C.orange;rr(x+4+sel*(hw-4),y+4,hw-4,h-8,22);ctx.fill();
  text('Score',x+hw/2+2,y+34,DISP6(24),sel<0.5?C.paper:C.ink,'center');text('Highway',x+hw+hw/2-2,y+34,DISP6(24),sel>=0.5?C.paper:C.ink,'center');ctx.globalAlpha=1}
// zoomed view of the flat note (css box ZB of practice-score) drawn at ZD, scale ZS
const ZB=[205,80,135,75],ZS=2.9,ZD=[560,362];
const zx=px=>ZD[0]+(px-ZB[0])*ZS,zy=py=>ZD[1]+(py-ZB[1])*ZS;
/* laptop mock-up: the 1280×800 screenshot in a simple rounded frame with a base */
function laptop(x,y,w,A){const h=w*0.625,src=IMG['fullscore-laptop'];if(A<=0.01)return;ctx.globalAlpha=A;
  ctx.fillStyle='#000';rr(x-12,y-12,w+24,h+24,16);ctx.fill();ctx.strokeStyle='#30365C';ctx.lineWidth=2;rr(x-12,y-12,w+24,h+24,16);ctx.stroke();
  ctx.save();rr(x,y,w,h,4);ctx.clip();ctx.drawImage(src,0,0,1280,800,x,y,w,h);ctx.restore();
  ctx.fillStyle='#1E2342';rr(x-50,y+h+13,w+100,15,7);ctx.fill();ctx.strokeStyle='#30365C';rr(x-50,y+h+13,w+100,15,7);ctx.stroke();
  ctx.fillStyle=C.paper;rr(x+w/2-44,y+h+13,88,6,3);ctx.fill();ctx.globalAlpha=1}
const LPt=(px,py,x,y,w)=>[x+px*w/1280,y+py*w/1280];
function sceneC(t,A){const x=170,y=110,lx=560;
  // line 8: tap Highway (0–.06) · highway (.06–.37) · laptop full score (.37–.66) · ± cents in every view (.66–1)
  const toT=ease((t-L(7).start+0.3)/0.45),toH=ramp(8,0.06,t,0.5),lap=ramp(8,0.37,t,0.6),both=ramp(8,0.66,t,0.6);
  phone('practice-score',x-30*toT,y,A*(1-toT));phone('practice-toggle',x,y,A*toT*(1-toH));phone('practice-highway',x-40*lap,y,A*toH*(1-lap));
  // 6: score view
  const k6=A*(1-toT),zA=k6*at(6,0.7,t),dim=1-0.55*zA/(A||1);
  callout(...P(200,236,x,y),lx,165,'Sheet music','your part on a staff, with the words',C.ink,k6*dim*at(6,0.14,t));
  callout(...P(135,127,x,y),lx,255,'Blue ink = your voice','drawn at the height you sing',C.cyan,k6*dim*at(6,0.4,t));
  if(zA>0.01){const [bx,by,bw,bh]=ZB,w=bw*ZS,h=bh*ZS,[dx,dy]=ZD,s=PH.s,src=IMG['practice-score'];
    ctx.globalAlpha=zA;text('On the note = in tune',lx,340,DISP6(28),C.orange);
    // lens: box on the phone + lines to the zoom
    const px0=x+bx*s,py0=y+by*s,pw=bw*s,ph=bh*s;ctx.strokeStyle=C.orange;ctx.lineWidth=2;ctx.strokeRect(px0,py0,pw,ph);
    ctx.globalAlpha=zA*0.5;ctx.beginPath();ctx.moveTo(px0+pw,py0);ctx.lineTo(dx,dy);ctx.moveTo(px0+pw,py0+ph);ctx.lineTo(dx,dy+h);ctx.stroke();ctx.globalAlpha=zA;
    ctx.fillStyle='#000';rr(dx-4,dy-4,w+8,h+8,14);ctx.fill();ctx.save();rr(dx,dy,w,h,12);ctx.clip();ctx.drawImage(src,bx*2,by*2,bw*2,bh*2,dx,dy,w,h);ctx.restore();
    ctx.strokeStyle=C.orange;ctx.lineWidth=2;rr(dx-4,dy-4,w+8,h+8,14);ctx.stroke();
    const f=zA*at(6,0.86,t);ctx.globalAlpha=zA;ctx.font=DISP6(28);const tw=ctx.measureText('On the note = in tune').width;
    if(f>0.01){ctx.globalAlpha=f;text(' · just under = flat',lx+tw,340,DISP6(28),C.cyan);
      const ny=zy(135),iy=zy(138.5),ex=dx+w+10;
      ctx.strokeStyle=C.orange;ctx.lineWidth=2;ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(zx(222),ny);ctx.lineTo(ex,ny);ctx.stroke();ctx.setLineDash([]);
      text('the note',ex+8,ny+6,MONO(18),C.orange);
      ctx.strokeStyle=C.cyan;ctx.beginPath();ctx.moveTo(zx(300),iy);ctx.lineTo(ex,iy+28);ctx.stroke();
      text('your voice: just under',ex+8,iy+34,MONO(18),C.cyan)}
    ctx.globalAlpha=1}
  // 7–8: the toggle on the pre-start screen, then tap Highway
  const kT=A*toT*(1-lap);
  if(kT>0.01){const sel=ramp(8,0.02,t,0.25),[hx,hy]=P(269,253,x,y);
    ctx.globalAlpha=kT*(1-toH);ctx.strokeStyle=C.orange;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx+30,hy-14);ctx.lineTo(lx-8,182);ctx.stroke();
    const tap=clamp((t-L(8).start-0.01*L(8).dur)/0.7,0,1);if(tap>0&&tap<1&&toH<1){ctx.globalAlpha=kT*(1-tap)*(1-toH);ctx.lineWidth=3;ctx.beginPath();ctx.arc(hx,hy,10+30*tap,0,7);ctx.stroke()}
    ctx.globalAlpha=1;pill(lx,156,sel,kT);
    ctx.globalAlpha=kT*(1-toH);text('remembered for next time',lx,236,SERIF(21),C.muted);ctx.globalAlpha=1}
  const kH=A*toH*(1-lap);
  callout(...P(346,502,x,y),lx,330,'Highway: bars scroll to the line',null,C.orange,kH*ramp(8,0.1,t));
  const kb=kH*at(8,0.24,t);if(kb>0.01){ctx.globalAlpha=kb;text('keep the blue line on them',lx,362,SERIF(21),C.muted);ctx.globalAlpha=1;ring(...P(150,506,x,y),18,C.cyan,kb)}
  // laptop: the whole choir score, your line highlighted; then smaller, next to both phone views
  if(lap>0.01){const lw=lerp(600,470,both),lxp=lerp(130+40*(1-lap),70,both),ly=lerp(150,140,both),la=A*lap;
    laptop(lxp,ly,lw,la);
    const ca=la*(1-both)*at(8,0.42,t);if(ca>0.01){const [ax,ay]=LPt(10,184,lxp,ly,lw),[bx2,by2]=LPt(1270,286,lxp,ly,lw);
      ctx.globalAlpha=ca;ctx.strokeStyle=C.cyan;ctx.lineWidth=2.5;rr(ax,ay,bx2-ax,by2-ay,6);ctx.stroke();ctx.globalAlpha=1;
      callout(bx2,(ay+by2)/2,800,262,'On a laptop:',null,C.orange,ca);
      ctx.globalAlpha=ca;text('the whole choir,',800,302,DISP6(28),C.ink);text('your line highlighted',800,340,DISP6(28),C.cyan);
      text('all voices (+ organ or piano)',800,380,SERIF(21),C.muted);ctx.globalAlpha=1}
    // every view: the ± cents bubble
    if(both>0.01){const a=A*both,r2=A*ramp(8,0.7,t,0.4);
      phone('practice-highway',650+50*(1-both),y,a);phone('practice-score',935+50*(1-both),y,a);
      ring(...LPt(984,192,lxp,ly,lw),24,C.cyan,r2);ring(...P(177.5,489.5,650,y),32,C.cyan,r2);ring(...P(316.75,88.75,935,y),30,C.cyan,r2);
      ctx.globalAlpha=a*ramp(8,0.68,t,0.4);const by0=ly+lw*0.625+80;text('± cents',lxp,by0,DISP(52),C.cyan);ctx.font=DISP(52);
      text('in every view',lxp+ctx.measureText('± cents').width+22,by0,MONO(18),C.faint);
      text('the bubble: + sharp · − flat',lxp,by0+38,SERIF(24),C.muted);ctx.globalAlpha=1}}}

/* D: sections, the level ladder (five levels), and "Sing it all" (the piece's level comes from a run in one go) */
const LV=[['1','Note-learning','70% tempo · on “doo” · every note right'],['2','In time','full tempo · words · your part plays'],['3','Independent','others only'],['4','Concert-ready','no note names · chord only'],['5','Off book','from memory · on two days']];
const LVCOL=[C.cyan,C.cyan,C.orange,C.purple,C2.green];
const SEGS=['Bars 1–5','Bars 6–13','Bars 14–21','Bars 22–29'];
function sceneD(t,A){const x=150,y=110,bx=520;
  // phone: piece screen (Sing it all + sections) → the to-fix version while a section slips → back
  const fx=ramp(12,0.62,t,0.5)*(1-ease((t-L(13).start+0.3)/0.45));
  phone('piece',x,y,A*(1-fx));if(fx>0.01)phone('piece-tofix',x,y,A*fx);
  // 9: what's on the piece screen (gone before the level cards come in)
  const c9=A*(1-ease((t-L(10).start+0.5)/0.4));
  callout(...P(100,433,x,y),560,380,'Sections','practice steps, level by level',C.cyan,c9*at(9,0.12,t));
  callout(...P(130,42,x,y),560,190,'Sing it all','the whole piece in one go: earns the level',C.orange,c9*at(9,0.55,t));
  // level cards; on line 12 they get compact to make room for the run below
  const k=ramp(12,0,t,0.6),LVH=lerp(72,50,k),LVG=lerp(13,8,k),LVY=lerp(130,108,k),yOf=i=>LVY+i*(LVH+LVG);
  LV.forEach((l,i)=>{const f=[0.0,0.28,0.41,0.6,0.78][i];const a=A*(lineIdx(t)>10?1:at(10,f,t));
    if(a<0.01)return;ctx.globalAlpha=a;const yy=yOf(i),bs=lerp(48,34,k);
    const col=LVCOL[i];ctx.fillStyle=C.panel;rr(bx,yy,500,LVH,lerp(16,12,k));ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;rr(bx,yy,500,LVH,lerp(16,12,k));ctx.stroke();
    ctx.fillStyle=col;rr(bx+14,yy+(LVH-bs)/2,bs,bs,lerp(12,9,k));ctx.fill();text(l[0],bx+14+bs/2,yy+LVH/2+lerp(11,8,k),DISP(lerp(30,23,k)),C.paper,'center');
    text(l[1],bx+lerp(80,64,k),yy+lerp(33,LVH/2+9,k),DISP6(lerp(27,24,k)),C.ink);
    ctx.globalAlpha=a*(1-k);text(l[2],bx+80,yy+59,MONO(16),C.muted);ctx.globalAlpha=1});
  // 12: targets next to levels 3 and 4
  const tg=1-ease((t-L(13).start+0.2)/0.4);const ar=A*tg*at(12,0.12,t);if(ar>0.01){ctx.globalAlpha=ar;text('← rehearsal-ready',bx+514,yOf(2)+22,MONO(19),C.orange);text('whole piece at 3',bx+514+28,yOf(2)+44,MONO(15),C.muted);ctx.globalAlpha=1}
  const ac=A*tg*at(12,0.38,t);if(ac>0.01){ctx.globalAlpha=ac;text('← concert-ready',bx+514,yOf(3)+22,MONO(19),C.purple);text('whole piece at 4',bx+514+28,yOf(3)+44,MONO(15),C.muted);ctx.globalAlpha=1}
  // 12: Sing it all, three runs: level 3 ✓, level 4 ✓, then one where a section slips
  const sA=A*ramp(12,0.02,t,0.4)*(1-ease((t-L(13).start+0.4)/0.4));
  if(sA>0.01){const u=lp(12,t),runs=[[0.05,0.3,3,-1],[0.38,0.56,4,-1],[0.6,0.78,4,1]],ri=u<0.35?0:u<0.585?1:2,[r0,r1,lv,slip]=runs[ri],p=clamp((u-r0)/(r1-r0),0,1);
    ctx.globalAlpha=sA;const py=420;ctx.font=DISP6(24);const lab='▶  Sing it all · level '+lv,pw=ctx.measureText(lab).width+40;
    ctx.fillStyle=C.orange;rr(bx,py,pw,46,23);ctx.fill();text(lab,bx+20,py+31,DISP6(24),C.paper);
    if(p>=1&&slip<0){text('✓ in one go',bx+pw+18,py+31,DISP6(24),C2.green)}
    const sy=486,sh=42,gw=8,sw=(500-3*gw)/4;
    SEGS.forEach((n,j)=>{const sx=bx+j*(sw+gw),done=p*4>=j+1,bad=j===slip&&done;
      ctx.fillStyle=bad?C.orange:done?C.deep:C.panel;rr(sx,sy,sw,sh,10);ctx.fill();ctx.strokeStyle=bad?C.orange:done?C.cyan:C.rule;ctx.lineWidth=2;rr(sx,sy,sw,sh,10);ctx.stroke();
      text(bad?'to fix':n,sx+sw/2,sy+27,bad?DISP6(22):MONO(15),bad?C.paper:done?C.ink:C.muted,'center')});
    if(p>0&&p<1){const hx=bx+p*500;ctx.fillStyle=C.ink;ctx.fillRect(hx-1.5,sy-10,3,sh+20)}
    const fA=sA*at(12,0.8,t);if(fA>0.01){ctx.globalAlpha=fA;const sx=bx+(sw+gw)+sw/2;
      ctx.strokeStyle=C.orange;ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy+sh+26,13,0.3,Math.PI*1.8);ctx.stroke();
      text('practise just that bit, then go again',sx+24,sy+sh+33,SERIF(22),C.orange)}
    ctx.globalAlpha=1;
    // on the phone: the to-fix list and the section tag
    const pr=A*fx*at(12,0.7,t);if(pr>0.01){ctx.globalAlpha=pr;ctx.strokeStyle=C.orange;ctx.lineWidth=3;
      let [qx,qy]=P(26,176,x,y);rr(qx,qy,330*PH.s,30*PH.s,8);ctx.stroke();[qx,qy]=P(10,610,x,y);rr(qx,qy,110*PH.s,24*PH.s,8);ctx.stroke();ctx.globalAlpha=1}}
  // 13–14: know it already? sing it all, at any level
  const kA=A*ease((t-L(13).start+0.2)/0.45);
  if(kA>0.01){ctx.globalAlpha=kA;const yy=436,tap=clamp((t-L(14).start-0.15*L(14).dur)/0.7,0,1);
    ctx.fillStyle=C.orange;rr(bx,yy,500,72,20);ctx.fill();text('Know it already?  ▶ Sing it all',bx+250,yy+46,DISP6(28),C.paper,'center');
    if(tap>0&&tap<1){ctx.globalAlpha=kA*(1-tap);ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.beginPath();ctx.arc(bx+400,yy+36,12+34*tap,0,7);ctx.stroke()}
    const anyA=kA*at(14,0.45,t);if(anyA>0.01){ctx.globalAlpha=anyA;ctx.strokeStyle=C.orange;ctx.lineWidth=3;const x2=bx+514,y1=yOf(0)+6,y2=yOf(4)+LVH-6;
      ctx.beginPath();ctx.moveTo(x2,y1);ctx.lineTo(x2+12,y1);ctx.lineTo(x2+12,y2);ctx.lineTo(x2,y2);ctx.stroke();
      text('any',x2+28,(y1+y2)/2-6,DISP6(26),C.orange);text('level',x2+28,(y1+y2)/2+24,DISP6(26),C.orange);
      text('no need to do the sections first',bx+250,yy+104,SERIF(22),C.muted,'center')}
    // on the phone: the Sing it all card's level row
    const ph=A*(1-fx)*at(13,0.25,t);if(ph>0.01){ctx.globalAlpha=ph;ctx.strokeStyle=C.orange;ctx.lineWidth=3;const [qx,qy]=P(26,120,x,y);rr(qx,qy,338*PH.s,56*PH.s,10);ctx.stroke()}
    ctx.globalAlpha=1}}

/* E: coach notes */
const NOTES=[['↓','Long notes sink','keep the support to the end'],['◷','Late after rests','breathe in tempo'],['♪','Wrong notes in bar 12','learn the pitches slowly']];
function sceneE(t,A){const x=150,y=110;phone('results-coach',x,y,A,{scrollCss:330});
  const bx=520;NOTES.forEach((n,k)=>{const a=A*at(16,[0.17,0.34,0.48][k],t);if(a<0.01)return;ctx.globalAlpha=a;const yy=150+k*100;
    ctx.fillStyle=C.panel;rr(bx,yy,600,84,16);ctx.fill();text(n[0],bx+30,yy+54,DISP(34),C.orange,'center');
    text(n[1],bx+64,yy+38,DISP6(27),C.ink);text(n[2],bx+64,yy+66,SERIF(21),C.muted);ctx.globalAlpha=1});
  const a=A*at(16,0.67,t);if(a>0.01){ctx.globalAlpha=a;const yy=470;ctx.fillStyle=C.orange;rr(bx,yy,600,64,14);ctx.fill();
    text('⟲  Loop bars 9–12 slowly',bx+300,yy+42,DISP6(27),C.paper,'center');ctx.globalAlpha=1}}

/* F: Home, every day */
function sceneF(t,A){const x=150,y=110;phone('home',x,y,A);
  const a1=A*at(17,0.02,t);if(a1>0.01){ctx.globalAlpha=a1;text("Today's plan",560,200,DISP(44),C.ink);
    text('paced to your rehearsal and concert dates',560,240,SERIF(24),C.muted);ctx.globalAlpha=1}
  callout(...P(60,236,x,y),560,330,'Days to rehearsal & concert',null,C.cyan,A*at(17,0.3,t));
  const a2=A*at(17,0.7,t);if(a2>0.01){ctx.globalAlpha=a2;text('≈ 10 minutes a day',560,440,DISP(40),C.orange);ctx.globalAlpha=1}}

/* G: try it now, a two-item checklist */
function num(cx,cy,n,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,28,0,7);ctx.fill();text(n,cx,cy+11,DISP(32),C.paper,'center')}
function sceneG(t,A){const x0=210;
  const a1=A*at(18,0.22,t);if(a1>0.01){ctx.globalAlpha=a1;const yy=180;num(x0,yy,'1',C.orange);
    text('Put on headphones',x0+52,yy+12,DISP6(36),C.ink);ctx.font=DISP6(36);const w=ctx.measureText('Put on headphones').width;
    text('→',x0+70+w,yy+12,DISP6(36),C.muted);
    const bx=x0+122+w;ctx.fillStyle=C.orange;rr(bx,yy-34,330,68,16);ctx.fill();text('Start voice setup',bx+165,yy+11,DISP6(30),C.paper,'center');ctx.globalAlpha=1}
  const a2=A*at(18,0.57,t);if(a2>0.01){ctx.globalAlpha=a2;const yy=310;num(x0,yy,'2',C.cyan);
    let cx=x0+52;const step=(s,last)=>{cx+=chip(cx,yy-24,s,last?C.cyan:C.rule,a2,false)+12;if(!last){text('→',cx+4,yy+10,DISP6(28),C.muted);cx+=40}ctx.globalAlpha=a2};
    step('Home');step('first piece');
    // level button look (as on the piece screen)
    ctx.fillStyle=C.panel;rr(cx,yy-30,250,60,12);ctx.fill();ctx.strokeStyle=C.cyan;ctx.lineWidth=2;rr(cx,yy-30,250,60,12);ctx.stroke();
    ctx.fillStyle=C.cyan;rr(cx+10,yy-20,40,40,10);ctx.fill();text('1',cx+30,yy+10,DISP(26),C.paper,'center');
    text('Level 1',cx+62,yy-2,DISP6(24),C.ink);text('first section',cx+62,yy+22,MONO(15),C.muted);ctx.globalAlpha=1}
  const a3=A*at(20,0.05,t);if(a3>0.01){ctx.globalAlpha=a3;text('≈ 5 minutes today',W/2,430,DISP6(34),C.orange,'center');
    text('tomorrow, Home shows your next step',W/2,470,SERIF(25),C.muted,'center');ctx.globalAlpha=1}
  const a4=A*at(21,0.0,t);if(a4>0.01){ctx.globalAlpha=a4;text("Let's sing.",W/2,550,DISP(52),C.cyan,'center');ctx.globalAlpha=1}}

const SCENES={A:sceneA,B:sceneB,C:sceneC,D:sceneD,E:sceneE,F:sceneF,G:sceneG};
const HEAD={B:'Voice setup',C:'The practice screen',D:'The level ladder',E:'Coach notes',F:'Every day',G:'Try it now'};

function speakers(t){const i=lineIdx(t),l=L(i),talking=t>=l.start&&t<=l.start+l.dur;
  [['N','NORA','coach',C.nora,880],['B','BEN','singer',C.ben,1070]].forEach(s=>{const on=talking&&l.sp===s[0],x=s[4],y=34;
    ctx.globalAlpha=on?1:.45;ctx.fillStyle=on?s[3]:C.panel;rr(x,y,180,40,20);ctx.fill();ctx.strokeStyle=s[3];ctx.lineWidth=1.5;rr(x,y,180,40,20);ctx.stroke();
    text(s[1],x+18,y+26,MONO(15),on?C.paper:s[3]);text(s[2],x+78,y+26,MONO(13),on?C.paper:C.muted);
    if(on){ctx.fillStyle=C.paper;for(let b=0;b<4;b++){const h=6+10*Math.abs(Math.sin(t*9+b*1.7));ctx.fillRect(x+148+b*6,y+20-h/2,3,h)}}});ctx.globalAlpha=1}
function subtitles(t){const s=TL.subs.find(x=>t>=x[0]-0.05&&t<x[1]+0.2);if(!s)return;ctx.font=SERIF(25);
  const ls=wrapText(s[3],980),bh=ls.length*34+22,y0=H-bh-14;ctx.globalAlpha=.92;ctx.fillStyle='#05060D';rr(90,y0,1100,bh,10);ctx.fill();ctx.globalAlpha=1;
  text(s[2]==='N'?'NORA':'BEN',112,y0+33,MONO(14),s[2]==='N'?C.nora:C.ben);ctx.font=SERIF(25);ctx.fillStyle=C.ink;ls.forEach((x,j)=>ctx.fillText(x,190,y0+34+j*34))}
window.renderAt=function(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);
  const i=lineIdx(t),sc=sceneOf(i),first=firstOf(sc),fin=ease((t-(L(first).start-0.45))/0.45);
  if(fin<1&&first>0)SCENES[sceneOf(first-1)](Math.min(t,L(first).start-0.46),1-fin);
  SCENES[sc](t,fin);
  if(HEAD[sc]){text('SCHÖNBERG HERO',44,52,MONO(13),C.orange);text(HEAD[sc],44,86,DISP(30),C.ink)}
  speakers(t);subtitles(t)};
window.ready=Promise.all([...[MONO(15),DISP(34),DISP6(28),SERIF(25)].map(f=>document.fonts.load(f)),imgReady]);
